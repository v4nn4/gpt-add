[project]
name = "gpt-add"
version = "0.1.0"
description = "Learning addition with a GPT model based on nanoGPT."
authors = [{ name = "v4nn4" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "torch>=2.5.1",
    "fire>=0.7.0",
    "pytest>=8.3.4",
    # outlines 1.x removed the outlines.generate API used in train.py
    "outlines>=0.1.8,<0.2",
    "tensorboard>=2.18.0",
    "torch-tb-profiler>=0.4.3",
    "seaborn>=0.13.2",
    "matplotlib>=3.9.4",
    "isort>=5.13.2",
    "black>=24.10.0",
    "ruff>=0.8.4",
]

[dependency-groups]
dev = ["ipykernel>=6.29.5"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gpt_add"
module-root = ""
